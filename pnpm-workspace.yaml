# 7 days
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@nuxt/ui"
  - form-data@4.0.6
  - "@esbuild/*"
  - esbuild@0.28.1
blockExoticSubdeps: true
# trustPolicy: no-downgrade
preferFrozenLockfile: true
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  vue-demi: true

overrides:
  "form-data@4": "^4.0.6"
  "esbuild@0": "^0.28.1"
  "brace-expansion@2": "^2.1.2"
  "nanoid@3": "^3.3.18"
  "postcss@8": "^8.4.25"
  # security: GHSA Tiptap ReDoS + mergeAttributes (fixed in 3.30.5); pulled in via @nuxt/ui, not used directly
  "@tiptap/core": "^3.31.3"
  "@tiptap/pm": "^3.31.3"
